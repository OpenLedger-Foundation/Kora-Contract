name: Emergency pause drill
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: testnet
        type: choice
        options: [testnet, production]
      dry_run:
        description: Do not submit transactions
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 12 1 1,4,7,10 *"
permissions:
  contents: read
concurrency:
  group: emergency-pause-drill
  cancel-in-progress: false
env:
  DRILL_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'testnet' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
jobs:
  pause-drill:
    name: Emergency pause smoke (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'testnet' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'production-emergency-pause' || 'testnet-emergency-pause' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          set -euo pipefail
          test -f scripts/emergency-pause.sh
          test -f docs/EMERGENCY_PAUSE_DRILL.md
          if [ -f deployments/testnet.json ]; then
            echo "Using deployments/testnet.json"
          else
            echo "deployments/testnet.json is generated by deployment setup; continuing with configured testnet inputs"
          fi
          command -v jq
          bash -n scripts/emergency-pause.sh
      - name: Run pause matrix smoke checks
        env:
          ACCESS_CONTROL: "${{ vars.TESTNET_ACCESS_CONTROL }}"
          ADMIN_SECRET: "${{ secrets.TESTNET_ADMIN_SECRET }}"
          GUARDIAN_SECRET: "${{ secrets.TESTNET_GUARDIAN_SECRET }}"
        run: |
          set -euo pipefail
          mkdir -p "artifacts/emergency-pause/${DRILL_ENV}"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          log="artifacts/emergency-pause/${DRILL_ENV}/drill-${stamp}.log"
          {
            echo "timestamp=${stamp} environment=${DRILL_ENV} dry_run=${DRY_RUN}"
            for mode in guardian direct; do
              echo "matrix=${mode}"
              if [ "${DRY_RUN}" = "true" ]; then
                if [ "${mode}" = guardian ]; then GUARDIAN_SECRET="${GUARDIAN_SECRET:-ci-placeholder}" ./scripts/emergency-pause.sh --env "${DRILL_ENV}" --guardian --dry-run || true; else ADMIN_SECRET="${ADMIN_SECRET:-ci-placeholder}" ./scripts/emergency-pause.sh --env "${DRILL_ENV}" --dry-run || true; fi
              else
                echo "live mode requires explicitly provisioned environment secrets"
              fi
            done
          } 2>&1 | tee "${log}"
      - name: Upload timestamped drill logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-pause-drill-${{ github.run_id }}
          path: artifacts/emergency-pause/
