name: Staging chaos suite

# Runs on a weekly schedule (Mondays 02:00 UTC) and on demand.
# workflow_dispatch inputs let you override scenario selection and the
# alert-lag window without editing the file.
#
# Required secrets (set in the "staging" GitHub environment):
#   CHAOS_DATABASE_URL   — Postgres DSN for the staging DB
#
# Optional variables (repository or environment vars; defaults shown):
#   CHAOS_STELLAR_RPC_URL           — http://localhost:8000
#   CHAOS_RECONCILER_ALERT_LAG_MS   — 15000
#   CHAOS_REQUIRED                  — true (always enforced in this workflow)
#
# If staging credentials are absent the job fails with a clear pre-flight
# error from global-setup.ts before any failure is injected.  See
# infra/chaos/.env.chaos.example for the full variable reference.

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: >
          Scenario to run (leave blank to run the full suite).
          Choices: rpc-outage | db-latency | keeper-crash |
                   network-partition | indexer-checkpointing |
                   reconciliation-alerting
        required: false
        default: ""
        type: string
      alert_lag_ms:
        description: >
          Override CHAOS_RECONCILER_ALERT_LAG_MS (milliseconds).
          Useful for slower staging environments.
        required: false
        default: "15000"
        type: string
      dry_run:
        description: >
          Print the Jest command that would run without executing it.
          Use this to validate inputs before a full run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chaos-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: infra/blue-green/docker-compose.yml
  CHAOS_ENV: staging
  CHAOS_API_URL: http://localhost:80
  CHAOS_INDEXER_ADMIN_URL: http://localhost:8081
  CHAOS_KEEPER_ADMIN_URL: http://localhost:8080
  CHAOS_DOCKER_PROJECT: kora-staging
  CHAOS_DB_CONTAINER: kora-postgres
  CHAOS_INDEXER_CONTAINER: kora-indexer-blue
  CHAOS_API_CONTAINER: kora-api-blue
  CHAOS_RECONCILER_ALERT_LAG_MS: ${{ inputs.alert_lag_ms || vars.CHAOS_RECONCILER_ALERT_LAG_MS || '15000' }}
  DB_STATEMENT_TIMEOUT_MS: 5000

jobs:
  # ── 1. Build / validate staging images ──────────────────────────────────
  services-image-build:
    name: prepare staging service images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging compose configuration
        env:
          DATABASE_URL: ${{ secrets.CHAOS_DATABASE_URL || 'postgres://kora:kora@localhost:5432/kora' }}
          STELLAR_RPC_URL: ${{ vars.CHAOS_STELLAR_RPC_URL || 'http://localhost:8000' }}
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: docker compose -p kora-staging -f "$COMPOSE_FILE" config --quiet

      - name: Pull staging service images
        run: docker compose -p kora-staging -f "$COMPOSE_FILE" pull --ignore-pull-failures

  # ── 2. Run chaos scenarios ───────────────────────────────────────────────
  chaos-staging:
    name: run staging chaos scenarios
    needs: services-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Always fail — chaos results are load-bearing for the staging signal.
    # Set CHAOS_REQUIRED=false in the repository/environment variables only
    # when explicitly triaging a known transient environment failure.
    continue-on-error: ${{ vars.CHAOS_REQUIRED == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/chaos/package-lock.json

      - name: Install chaos harness dependencies
        working-directory: infra/chaos
        run: npm ci

      # Abort early with a clear message rather than a confusing container
      # health-check timeout when the DATABASE_URL secret is not configured.
      - name: Check required staging credentials
        env:
          CHAOS_DATABASE_URL: ${{ secrets.CHAOS_DATABASE_URL }}
        run: |
          if [ -z "${CHAOS_DATABASE_URL}" ]; then
            echo "::error title=Missing secret::CHAOS_DATABASE_URL is not set."
            echo "Configure the secret in the 'staging' GitHub environment."
            echo "See infra/chaos/.env.chaos.example for the full variable reference."
            exit 1
          fi

      - name: Start staging composition
        env:
          DATABASE_URL: ${{ secrets.CHAOS_DATABASE_URL || 'postgres://kora:kora@localhost:5432/kora' }}
          STELLAR_RPC_URL: ${{ vars.CHAOS_STELLAR_RPC_URL || 'http://localhost:8000' }}
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: docker compose -p kora-staging -f "$COMPOSE_FILE" up -d

      - name: Wait for health probes
        run: |
          echo "Waiting for staging services to become healthy…"
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://localhost:80/health && \
               curl --fail --silent http://localhost:8081/health; then
              echo "All health probes passed on attempt ${attempt}."
              exit 0
            fi
            echo "  attempt ${attempt}/24 — sleeping 5 s"
            sleep 5
          done
          echo "::error title=Health probe timeout::Staging services did not become healthy within 120 s."
          docker compose -p kora-staging -f "$COMPOSE_FILE" ps
          docker compose -p kora-staging -f "$COMPOSE_FILE" logs --tail=50
          exit 1

      # Resolve the Jest --testPathPattern argument from the scenario input.
      # An empty input runs the full suite.
      - name: Resolve scenario filter
        id: filter
        run: |
          scenario="${{ inputs.scenario }}"
          if [ -n "${scenario}" ]; then
            echo "pattern=--testPathPattern=scenario-${scenario}" >> "$GITHUB_OUTPUT"
            echo "label=scenario: ${scenario}" >> "$GITHUB_OUTPUT"
          else
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "label=full suite" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run check (print command only)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN — would execute:"
          echo "  cd infra/chaos && npm test -- --runInBand ${{ steps.filter.outputs.pattern }}"
          echo "Exiting without running."

      - name: Run chaos suite (${{ steps.filter.outputs.label }})
        if: ${{ inputs.dry_run != true }}
        working-directory: infra/chaos
        env:
          CHAOS_ENV: staging
          CHAOS_RECONCILER_ALERT_LAG_MS: ${{ env.CHAOS_RECONCILER_ALERT_LAG_MS }}
          DB_STATEMENT_TIMEOUT_MS: ${{ env.DB_STATEMENT_TIMEOUT_MS }}
        run: |
          mkdir -p results
          npm test -- --runInBand ${{ steps.filter.outputs.pattern }} 2>&1 | tee results/chaos-summary.txt
          # Propagate the Jest exit code — tee masks it otherwise.
          exit "${PIPESTATUS[0]}"

      - name: Emit invariant summary to job summary
        if: ${{ inputs.dry_run != true && always() }}
        run: |
          echo "## Chaos suite results — ${{ steps.filter.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 infra/chaos/results/chaos-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output — suite did not produce a summary file)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chaos summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-staging-${{ github.run_id }}
          path: infra/chaos/results/chaos-summary.txt
          if-no-files-found: warn

      - name: Tear down staging composition
        if: always()
        run: docker compose -p kora-staging -f "$COMPOSE_FILE" down -v
