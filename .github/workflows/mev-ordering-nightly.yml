name: MEV ordering nightly observation

on:
  schedule:
    # Nightly at 03:00 UTC, after the load-testing run (Sundays 02:00 UTC).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: Number of competition rounds
        required: false
        default: '6'
      accounts:
        description: Competing accounts per round
        required: false
        default: '4'

permissions:
  contents: read

concurrency:
  group: mev-ordering-nightly
  cancel-in-progress: false

env:
  CI: 'true'
  MEV_MODE: testnet
  MEV_ENV: staging
  MEV_RPC_URL: https://soroban-testnet.stellar.org
  MEV_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
  MEV_AUTOFUND_ACCOUNTS: 'true'
  MEV_ROUNDS: ${{ github.event.inputs.rounds || '6' }}
  MEV_ACCOUNTS_PER_ROUND: ${{ github.event.inputs.accounts || '4' }}
  MEV_OBSERVE_TIMEOUT_MS: '30000'
  MEV_EXPECT_FEE_PRIORITY: 'false'
  MEV_STRICT_ARRIVAL_ORDER: 'false'
  MEV_MAX_HARD_DEVIATIONS: '0'
  MEV_OUTPUT_DIR: results

jobs:
  observe-order:
    name: observe testnet transaction ordering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/mev-ordering/package-lock.json
      - name: Install harness dependencies
        working-directory: infra/mev-ordering
        run: npm ci
      - name: Run ordering observation harness
        working-directory: infra/mev-ordering
        run: |
          mkdir -p results
          npm run harness:testnet 2>&1 | tee results/mev-ordering-summary.txt
      - name: Upload ordering artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mev-ordering-${{ github.run_id }}
          path: |
            infra/mev-ordering/results/mev-ordering-*.json
            infra/mev-ordering/results/mev-ordering-summary.txt
          retention-days: 30
          if-no-files-found: warn
