rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  - name: reconciler gap detected fires warning after debounce
    interval: 1m
    input_series:
      - series: 'kora_reconciler_gaps_detected_total{job="kora-reconciler"}'
        values: "0 5 5 5"
    alert_rule_test:
      - eval_time: 3m
        alertname: KoraLedgerGapDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              tier: sev-2
            exp_annotations:
              summary: Kora ledger gap detected

  - name: reconciler queue stuck fires critical after 2m
    interval: 1m
    input_series:
      - series: 'kora_reconciler_oldest_gap_age_seconds{job="kora-reconciler"}'
        values: "0 400 400 400"
    alert_rule_test:
      - eval_time: 4m
        alertname: KoraReconcilerAlertQueueStuck
        exp_alerts:
          - exp_labels:
              severity: critical
              tier: sev-1
            exp_annotations:
              summary: Kora reconciler alert queue stuck — oldest gap is too old

  - name: reconciler queue stuck does not fire when age is below threshold
    interval: 1m
    input_series:
      - series: 'kora_reconciler_oldest_gap_age_seconds{job="kora-reconciler"}'
        values: "0 200 200 200"
    alert_rule_test:
      - eval_time: 4m
        alertname: KoraReconcilerAlertQueueStuck
        exp_alerts: []

  - name: circuit breaker trips page on-call after debounce
    interval: 1m
    input_series:
      - series: 'kora_onchain_events_total{event_type="circuit_breaker_trip", job="kora-indexer"}'
        values: "0 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: KoraCircuitBreakerTripped
        exp_alerts:
          - exp_labels:
              severity: critical
              tier: sev-1
              event_type: circuit_breaker_trip
              job: kora-indexer
            exp_annotations:
              summary: Kora circuit breaker tripped
              description: A circuit-breaker trip was observed in the last five minutes. Follow the Sev-1 incident runbook.

  - name: default events are warning-only
    interval: 1m
    input_series:
      - series: 'kora_onchain_events_total{event_type="default", job="kora-indexer"}'
        values: "0 1 1 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: KoraInvoiceDefaultObserved
        exp_alerts:
          - exp_labels:
              severity: warning
              tier: sev-2
              event_type: default
              job: kora-indexer
            exp_annotations:
              summary: Kora invoice default event observed
              description: A default event was observed. Defaults can be expected protocol events; investigate context before escalation.
  - name: pause not effective on one target fires sev-1
    interval: 1m
    input_series:
      - series: 'kora_pause_effective{target="access_control", contract="CA1"}'
        values: "1 1"
      - series: 'kora_pause_effective{target="treasury", contract="CT1"}'
        values: "0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: KoraPauseNotEffective
        exp_alerts:
          - exp_labels:
              severity: critical
              tier: sev-1
              target: treasury
              contract: CT1
            exp_annotations:
              summary: Pause not effective on treasury
              description: is_paused did not return true for treasury (CT1) after a pause/drill. Re-run the pause for this target immediately.

  - name: pause effective on all targets stays quiet
    interval: 1m
    input_series:
      - series: 'kora_pause_effective{target="access_control", contract="CA1"}'
        values: "1 1"
      - series: 'kora_pause_probe_error{target="access_control", contract="CA1"}'
        values: "0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: KoraPauseNotEffective
        exp_alerts: []
      - eval_time: 1m
        alertname: KoraPauseProbeFailed
        exp_alerts: []

  - name: pause probe failure fires sev-1
    interval: 1m
    input_series:
      - series: 'kora_pause_probe_error{target="price_oracle", contract="CP1"}'
        values: "1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: KoraPauseProbeFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              tier: sev-1
              target: price_oracle
              contract: CP1
            exp_annotations:
              summary: Pause state unverifiable for price_oracle
              description: The is_paused probe failed for price_oracle; treat the target as NOT paused until verified.
