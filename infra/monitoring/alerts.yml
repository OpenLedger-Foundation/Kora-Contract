groups:
  - name: kora-service-health
    rules:
      - alert: KoraHealthAggregatorUnavailable
        expr: up{job="kora-health"} == 0
        for: 2m
        labels:
          severity: critical
          tier: sev-1
        annotations:
          summary: Kora health aggregator is unavailable
          description: The aggregated health endpoint has been unreachable for at least two minutes.

      - alert: KoraServiceUnavailable
        expr: up{job=~"kora-(keeper|indexer)"} == 0
        for: 3m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora service {{ $labels.job }} is unavailable
          description: The service metrics endpoint has been unreachable for at least three minutes.

      - alert: KoraAggregatedServiceDown
        expr: kora_service_health{status="down"} == 1
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora service {{ $labels.service }} is down
          description: The health aggregator has reported this service down for at least two minutes.

      - alert: KoraKeeperDeadLetterJobs
        expr: kora_keeper_jobs{status="dead"} > 0
        for: 5m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Keeper has jobs requiring operator review
          description: '{{ $value }} keeper jobs are in the dead-letter state.'

  - name: kora-reconciler
    rules:
      - alert: KoraLedgerGapDetected
        expr: increase(kora_reconciler_gaps_detected_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          tier: sev-2
        annotations:
          summary: Kora ledger gap detected
          description: >
            The reconciler detected a ledger gap in the last five minutes.
            Gap age is {{ $value }} ledgers behind the RPC head.
            Inspect /reconciler/status and /reconciler/alerts/pending.

      - alert: KoraReconcilerAlertQueueStuck
        expr: kora_reconciler_oldest_gap_age_seconds > 300
        for: 2m
        labels:
          severity: critical
          tier: sev-1
        annotations:
          summary: Kora reconciler alert queue stuck — oldest gap is too old
          description: >
            The oldest undelivered alert in the reconciler queue has been
            pending for {{ $value | humanizeDuration }}.  The alert sink may
            be unreachable or the reconciler may have stopped scanning.
            Follow the Sev-1 incident runbook.

      - alert: KoraReconcilerDown
        expr: up{job="kora-reconciler"} == 0
        for: 3m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora reconciler metrics endpoint unreachable
          description: >
            The reconciler metrics scrape has been failing for at least three
            minutes.  Ledger gaps may be going undetected.

  - name: kora-onchain-events
    rules:
      - alert: KoraCircuitBreakerTripped
        expr: increase(kora_onchain_events_total{event_type="circuit_breaker_trip"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          tier: sev-1
        annotations:
          summary: Kora circuit breaker tripped
          description: A circuit-breaker trip was observed in the last five minutes. Follow the Sev-1 incident runbook.

      - alert: KoraInvoiceDefaultObserved
        expr: increase(kora_onchain_events_total{event_type="default"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-2
        annotations:
          summary: Kora invoice default event observed
          description: A default event was observed. Defaults can be expected protocol events; investigate context before escalation.

      - alert: KoraTreasurySweepObserved
        expr: increase(kora_onchain_events_total{event_type="treasury_sweep"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora treasury sweep observed
          description: Verify the sweep amount and authorized transaction; expected sweeps do not page on-call.


  - name: kora-fx-ingestion
    rules:
      - alert: KoraFxRateStale
        expr: max by (base, quote) (kora_fx_rate_age_seconds) > 1800
        for: 5m
        labels:
          severity: warning
          tier: sev-2
        annotations:
          summary: Kora FX rate for {{ $labels.base }}/{{ $labels.quote }} is stale
          description: >
            No successful FX publication for {{ $labels.base }}/{{ $labels.quote }}
            in {{ $value }} seconds (threshold 1800s, sustained 5m).
            Multi-currency invoice displays and funding math depend on fresh rates;
            inspect the fx-ingestion /metrics endpoint and source availability.

      - alert: KoraFxRateNeverPublished
        expr: absent(kora_fx_rate_age_seconds)
        for: 15m
        labels:
          severity: warning
          tier: sev-2
        annotations:
          summary: Kora FX ingestion has never published a rate
          description: >
            The staleness gauge kora_fx_rate_age_seconds has been absent for 15
            minutes — no FX pair has been successfully ingested since startup.
            Check FX_RELAY_SECRET, source API keys, and the oracle contract address.

      - alert: KoraFxIngestionDown
        expr: up{job="kora-fx-ingestion"} == 0
        for: 3m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora FX ingestion metrics endpoint unreachable
          description: >
            The fx-ingestion /metrics scrape has been failing for at least three
            minutes. FX staleness may be going undetected.
