groups:
  - name: kora-service-health
    rules:
      - alert: KoraHealthAggregatorUnavailable
        expr: up{job="kora-health"} == 0
        for: 2m
        labels:
          severity: critical
          tier: sev-1
        annotations:
          summary: Kora health aggregator is unavailable
          description: The aggregated health endpoint has been unreachable for at least two minutes.

      - alert: KoraServiceUnavailable
        expr: up{job=~"kora-(keeper|indexer|risk-pipeline|governance-sync)"} == 0
        for: 3m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora service {{ $labels.job }} is unavailable
          description: The service metrics endpoint has been unreachable for at least three minutes.

      - alert: KoraAggregatedServiceDown
        expr: kora_service_health{status="down"} == 1
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora service {{ $labels.service }} is down
          description: The health aggregator has reported this service down for at least two minutes.

      - alert: KoraKeeperDeadLetterJobs
        expr: kora_keeper_jobs{status="dead"} > 0
        for: 5m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Keeper has jobs requiring operator review
          description: '{{ $value }} keeper jobs are in the dead-letter state.'

  - name: kora-onchain-events
    rules:
      - alert: KoraCircuitBreakerTripped
        expr: increase(kora_onchain_events_total{event_type="circuit_breaker_trip"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          tier: sev-1
        annotations:
          summary: Kora circuit breaker tripped
          description: A circuit-breaker trip was observed in the last five minutes. Follow the Sev-1 incident runbook.

      - alert: KoraInvoiceDefaultObserved
        expr: increase(kora_onchain_events_total{event_type="default"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-2
        annotations:
          summary: Kora invoice default event observed
          description: A default event was observed. Defaults can be expected protocol events; investigate context before escalation.

      - alert: KoraTreasurySweepObserved
        expr: increase(kora_onchain_events_total{event_type="treasury_sweep"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora treasury sweep observed
          description: Verify the sweep amount and authorized transaction; expected sweeps do not page on-call.

  - name: kora-risk-pipeline
    rules:
      - alert: KoraRiskPipelineJobFailures
        expr: increase(kora_risk_pipeline_job_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora risk pipeline job failures detected
          description: Risk pipeline has encountered scoring evaluation job failures in the last five minutes.

      - alert: KoraRiskPipelineStaleScores
        expr: kora_risk_pipeline_stale_scores > 0
        for: 5m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Stale risk scores detected
          description: '{{ $value }} SME risk profile scores exceed staleness threshold and have not been refreshed.'

      - alert: KoraRiskPipelineHeartbeatMissing
        expr: (time() - kora_risk_pipeline_heartbeat_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora risk pipeline heartbeat missing
          description: No heartbeat observed from risk pipeline service for more than 5 minutes.

  - name: kora-governance-sync
    rules:
      - alert: KoraGovernanceSyncRpcErrors
        expr: increase(kora_governance_sync_rpc_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora governance sync Soroban RPC errors observed
          description: Governance sync service encountered Soroban RPC query failures when syncing on-chain proposals.

      - alert: KoraGovernanceSyncHeartbeatMissing
        expr: (time() - kora_governance_sync_heartbeat_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: warning
          tier: sev-3
        annotations:
          summary: Kora governance sync heartbeat missing
          description: No heartbeat observed from governance sync service for more than 5 minutes.