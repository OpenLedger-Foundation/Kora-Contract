global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kora-health
    metrics_path: /metrics
    static_configs:
      - targets: ["health-aggregator:8080"]

  - job_name: kora-keeper
    metrics_path: /metrics
    static_configs:
      - targets: ["keeper:8080"]

  - job_name: kora-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["indexer:9090"]

  - job_name: kora-risk-pipeline
    metrics_path: /metrics
    static_configs:
      - targets: ["risk-pipeline:8081"]

  - job_name: kora-governance-sync
    metrics_path: /metrics
    static_configs:
      - targets: ["governance-sync:8082"]