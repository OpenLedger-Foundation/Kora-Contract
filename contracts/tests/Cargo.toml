[package]
name = "kora-tests"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

# ── Integration test suites ───────────────────────────────────────────────────
# Pre-existing edge-case suites
[[test]]
name = "financing_pool_edge_cases"
path = "financing_pool_edge_cases.rs"

[[test]]
name = "marketplace_edge_cases"
path = "marketplace_edge_cases.rs"

[[test]]
name = "invoice_nft_edge_cases"
path = "invoice_nft_edge_cases.rs"

[[test]]
name = "access_control_edge_cases"
path = "access_control_edge_cases.rs"

[[test]]
name = "treasury_edge_cases"
path = "treasury_edge_cases.rs"

[[test]]
name = "treasury_collect_fee_auth"
path = "treasury_collect_fee_auth.rs"

[[test]]
name = "issue_468_currency_resolution"
path = "issue_468_currency_resolution.rs"

[[test]]
name = "issue_469_position_balance"
path = "issue_469_position_balance.rs"

[[test]]
name = "issue_470_concentration_cap"
path = "issue_470_concentration_cap.rs"

[[test]]
name = "issue_471_secondary_market_settlement"
path = "issue_471_secondary_market_settlement.rs"

# ── New security regression suites (#611–#614) ────────────────────────────────

# #611 — Security regression tests sourced from AUDIT_LOG.md
[[test]]
name = "security_regression_audit_log"
path = "security_regression_audit_log.rs"

# #612 — DoS resistance: unbounded Vec growth (PriceFeeders, DebtorAttestors)
[[test]]
name = "dos_vec_growth"
path = "dos_vec_growth.rs"

# #613 — Timelock bypass regression (price_oracle upgrade, governance param change)
[[test]]
name = "timelock_bypass_regression"
path = "timelock_bypass_regression.rs"

# #614 — Multisig threshold manipulation (signer removed / threshold changed mid-flight)
[[test]]
name = "multisig_threshold_manipulation"
path = "multisig_threshold_manipulation.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kora-shared = { path = "../shared" }
kora-invoice-nft = { path = "../invoice_nft" }
kora-marketplace = { path = "../marketplace" }
kora-financing-pool = { path = "../financing_pool" }
kora-treasury = { path = "../treasury" }
kora-risk-registry = { path = "../risk_registry" }
kora-access-control = { path = "../access_control" }
kora-price-oracle = { path = "../price_oracle" }

# ── Integration test targets ──────────────────────────────────────────────────
# Each [[test]] entry wires a standalone .rs file in contracts/tests/ as a
# named integration-test binary, making it discoverable by `cargo test --workspace`.

[[test]]
name = "access_control_edge_cases"
path = "access_control_edge_cases.rs"

[[test]]
name = "invoice_nft_edge_cases"
path = "invoice_nft_edge_cases.rs"

[[test]]
name = "marketplace_edge_cases"
path = "marketplace_edge_cases.rs"

[[test]]
name = "financing_pool_edge_cases"
path = "financing_pool_edge_cases.rs"

[[test]]
name = "treasury_edge_cases"
path = "treasury_edge_cases.rs"

[[test]]
name = "treasury_collect_fee_auth"
path = "treasury_collect_fee_auth.rs"

[[test]]
name = "issue_468_currency_resolution"
path = "issue_468_currency_resolution.rs"

[[test]]
name = "issue_469_position_balance"
path = "issue_469_position_balance.rs"

[[test]]
name = "issue_470_concentration_cap"
path = "issue_470_concentration_cap.rs"

[[test]]
name = "issue_471_secondary_market_settlement"
