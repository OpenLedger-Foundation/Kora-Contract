[package]
name = "kora-recurring-facility"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
kora-shared = { path = "../shared" }
kora-risk-registry = { path = "../risk_registry" }
kora-financing-pool = { path = "../financing_pool" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
