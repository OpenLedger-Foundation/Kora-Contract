[package]
name = "kora-xtask"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "check-error-variants"
path = "src/main.rs"

[[bin]]
name = "upgrade-coordinator"
path = "src/bin/upgrade_coordinator.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
