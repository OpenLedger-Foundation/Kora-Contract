[package]
name = "kora-xtask"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "check-error-variants"
path = "src/main.rs"

[[bin]]
name = "upgrade-coordinator"
path = "src/bin/upgrade_coordinator.rs"

[[bin]]
name = "wasm-metrics"
path = "src/bin/wasm_metrics.rs"

[[bin]]
name = "check_access_matrix"
path = "src/bin/check_access_matrix.rs"

[[bin]]
name = "check_pause_matrix"
path = "src/bin/check_pause_matrix.rs"

[[bin]]
name = "bootstrap-registry"
path = "src/bin/bootstrap_registry.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proptest = "1"
