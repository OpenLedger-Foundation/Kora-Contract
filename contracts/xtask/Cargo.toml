[package]
name = "kora-xtask"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "check-error-variants"

[lib]
path = "src/lib.rs"

[[bin]]
name = "check-error-variants"
path = "src/main.rs"

[[bin]]
name = "contract-spec"
path = "src/bin/contract_spec.rs"

[[bin]]
name = "upgrade-coordinator"
path = "src/bin/upgrade_coordinator.rs"

[[bin]]
name = "wasm-metrics"
path = "src/bin/wasm_metrics.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proptest = "1"
stellar-xdr = { version = "21.2.0", default-features = false, features = ["curr", "alloc"] }
soroban-spec = "21.7.7"

